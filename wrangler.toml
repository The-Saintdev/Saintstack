name = "saintstack"
main = "src/index.ts"
compatibility_date = "2024-04-05"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"

# Custom Domain (When crescoafrica.com is on Cloudflare DNS):
routes = [
  { pattern = "saintstack.crescoafrica.com", custom_domain = true }
]

# Note: Secret variables such as DATABASE_URL and SAINTSTACK_API_KEY
# should be configured via `wrangler secret put <KEY>` or in `.dev.vars` locally.
